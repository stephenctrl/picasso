<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f6f2" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let preference = null;
        try { preference = localStorage.getItem('picasso.theme'); } catch {}
        const theme = preference === 'light' || preference === 'dark'
          ? preference
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#171e1b' : '#f6f6f2');
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', theme);
      })();
    </script>
    <style>
      :root { background: #f6f6f2; color: #283b32; }
      :root[data-theme="dark"] { background: #171e1b; color: #e4ebe4; }
    </style>
    <meta name="description" content="Compose HTML and CSS visually. Drag components, refine the design, preview, and copy a working page with Picasso." />
    <title>Picasso — Design visually. Copy code.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
